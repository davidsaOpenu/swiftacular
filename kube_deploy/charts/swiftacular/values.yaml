---
registry: localhost:5001
backend: missing

namespace: swiftacular

swift:
  diskPrefix: td
  disksPerNode: 2
  diskSizeGi: 5
  partitionPower: 12
  replicas: 2
  minPartHours: 1
  hashPathSuffix: CHANGEME
  hashPathPrefix: CHANGEME

storage:
  storageClassName: local-path
  image: storage
  tag: latest

mariadb:
  image: mariadb
  tag: "11.4"

proxy:
  image: proxy
  tag: latest

keystone:
  image: keystone
  tag: latest
  region: Edmonton

packageCache:
  image: package-cache
  tag: latest
  enabled: true

grafana:
  enabled: false
  image: grafana/grafana
  tag: "10.4.3"

bluestore:
  enabled: false
  image: bluestore
  tag: latest
  storeSizeGi: 12
  cpuLimit: "2"
  memoryLimit: "2Gi"

secrets:
  keystoneAdminPassword: CHANGEME
  keystoneMysqlPassword: CHANGEME
  keystoneGenericServicePassword: CHANGEME
  # Must stay CHANGEME: the shared workload_tests/test_workload.py (also used
  # by the VM/Ansible flow) hardcodes KEY = "CHANGEME" for the achilles user.
  keystoneTestUserPassword: CHANGEME
  grafanaAdminPassword: CHANGEME

keystone_test_user: achilles
