apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-conf
  namespace: {{ include "swiftacular.namespace" . }}
  labels:
    {{- include "swiftacular.labels" . | nindent 4 }}
data:
  account-server.conf: |
    [DEFAULT]
    devices = /srv/node
    bind_ip = ${MY_POD_IP}
    bind_port = 6002
    workers = 2

    [pipeline:main]
    pipeline = account-server

    [app:account-server]
    use = egg:swift#account

    [account-replicator]

    [account-auditor]

    [account-reaper]

  account-replication.conf: |
    [DEFAULT]
    devices = /srv/node
    bind_ip = ${MY_POD_IP}
    bind_port = 6012
    workers = 2

    [pipeline:main]
    pipeline = account-server

    [app:account-server]
    use = egg:swift#account
    replication_server = True

    [account-replicator]

    [account-auditor]

    [account-reaper]

  container-server.conf: |
    [DEFAULT]
    devices = /srv/node
    bind_ip = ${MY_POD_IP}
    bind_port = 6001
    workers = 2

    [pipeline:main]
    pipeline = container-server

    [app:container-server]
    use = egg:swift#container

    [container-replicator]

    [container-updater]

    [container-auditor]

    [container-sync]

    [container-sharder]
    auto_shard = true
    rsync_module = {replication_ip}::container{replication_port}
    shard_container_threshold = 100
    shard_scanner_batch_size = 10
    cleave_batch_size = 2

  container-replication.conf: |
    [DEFAULT]
    devices = /srv/node
    bind_ip = ${MY_POD_IP}
    bind_port = 6011
    workers = 2

    [pipeline:main]
    pipeline = container-server

    [app:container-server]
    use = egg:swift#container
    replication_server = True

    [container-replicator]

    [container-updater]

    [container-auditor]

    [container-sync]

    [container-sharder]
    auto_shard = true
    rsync_module = {replication_ip}::container{replication_port}
    shard_container_threshold = 100
    shard_scanner_batch_size = 10
    cleave_batch_size = 2

  object-server.conf: |
    [DEFAULT]
    devices = /srv/node
    bind_ip = ${MY_POD_IP}
    bind_port = 6000
    {{- if eq .Values.backend "bs_bind" }}
    servers_per_port = 1
    {{- else }}
    workers = 2
    {{- end }}

    [pipeline:main]
    pipeline = object-server

    [app:object-server]
    {{- if eq .Values.backend "memory" }}
    use = egg:swift#mem_object
    {{- else if eq .Values.backend "bs_fork" }}
    use = egg:swift#bs_object
    {{- else if eq .Values.backend "bs_bind" }}
    {{- $MiB := mul 1024 1024 }}
    {{- $GiB := mul $MiB 1024 }}
    disk_chunk_size = {{ $MiB }}
    network_chunk_size = {{ $MiB }}
    bluestore_capacity = {{ mul $GiB .Values.swift.bluestore_capacity }}
    eventlet_tpool_num_threads = 64
    use = egg:swift#object
    {{- else }}
    use = egg:swift#object
    {{- end }}

    [object-replicator]

    [object-updater]

    [object-auditor]

    [object-expirer]

    [object-reconstructor]

    [object-relinker]

  object-replication.conf: |
    [DEFAULT]
    devices = /srv/node
    bind_ip = ${MY_POD_IP}
    bind_port = 6010
    workers = 2

    [pipeline:main]
    pipeline = object-server

    [app:object-server]
    use = egg:swift#object
    replication_server = True

    [object-replicator]

    [object-updater]

    [object-auditor]

    [object-expirer]

    [object-reconstructor]

    [object-relinker]

  rsyncd.conf: |
    uid = swift
    gid = swift
    # /proc/1/fd/1 is PID 1's stdout (the container stdout); writing the rsync
    # daemon log there reaches `kubectl logs` instead of an ephemeral file.
    log file = /proc/1/fd/1
    pid file = /var/run/rsyncd.pid
    address = ${MY_POD_IP}

    [account]
    max connections = 2
    path = /srv/node/
    read only = false
    lock file = /var/lock/account.lock

    [container]
    max connections = 2
    path = /srv/node/
    read only = false
    lock file = /var/lock/container.lock

    [object]
    max connections = 2
    path = /srv/node/
    read only = false
    lock file = /var/lock/object.lock
