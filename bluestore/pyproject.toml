# The project, how it is built, and how its tests are run.
# see ARCHITECTURE.md#building

[project]
name = "bluestore"
version = "1.0.0"
requires-python = ">=3.9,<3.10"
dependencies = ["swift==2.35.0"]

# Swift finds our manager here as egg:bluestore#manager; policy.py must match.
# see ARCHITECTURE.md#interface
[project.entry-points."swift.diskfile"]
manager = "bluestore.manager:BluestoreDiskFileManager"

[dependency-groups]
build = ["scikit-build-core>=1.0.0", "nanobind", "cython", "pyyaml"]
dev = ["pytest", { include-group = "build" }]

[build-system]
requires = ["scikit-build-core>=1.0.0", "nanobind", "cython", "pyyaml"]
build-backend = "scikit_build_core.build"

[tool.uv]
no-build-isolation-package = ["bluestore"]
# A source location not covered here can be edited without triggering a rebuild.
cache-keys = [
	{ file = "pyproject.toml" },
	{ file = "CMakeLists.txt" },
	{ file = "src/bluestore/**" },
	{ file = "src/extension/**" },
	{ file = "src/injection/**" }
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build"
wheel.reproducible = true

# Python only reads .pth files from site-packages itself, not from a package.
# see ARCHITECTURE.md#policy
[tool.scikit-build.wheel.force-include]
"src/bluestore/hook_apply.pth" = "bluestore_hook.pth"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
tmp_path_retention_policy = "failed"
testpaths = ["src/test/"]
# The default run's kinds. A -m on the command line replaces them rather than
# adding to them, and a test with no kind is never run.
# see ARCHITECTURE.md#testing
addopts= ["--strict-markers", "-m", "diff or engine or device"]
markers = [
    "incremental: sequence class; skip remaining tests after a failure",
	"diff: every request answered by both backends and compared",
	"engine: the engine, the binding and the command line tool, without an object server",
	"device: the Device and the metadata rules, without an object server",
	"fork: the same work timed through the binding and through the tool",
	"smoke: concurrent mixed operations on shared names, with a stall heartbeat",
]
