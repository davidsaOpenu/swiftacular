---
# Apply Swift patches and install the BlueStore backend.
#
# The patch list and the application logic live in swift_patches/ (patches.manifest
# driven by apply.sh) — the single source of truth shared with the Kubernetes image
# build (kube_deploy/dockerfiles/Dockerfile.storage).  Adding a patch is a one-row
# change to patches.manifest; this playbook does not enumerate patches.

# Install patch utility on all nodes (OS-specific; apply.sh needs the binary)
- name: Install patch utility
  hosts: all
  become: true
  tasks:
    - name: Install patch package
      ansible.builtin.dnf:
        name: patch
        state: present

# Apply the shared recipe on storage nodes
- name: Apply Swift patches
  hosts: storage
  become: true
  tasks:
    - name: Copy swift_patches to the storage node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/swift_patches"
        dest: /tmp/
        mode: "0755"

    - name: Apply Swift patches via the shared applier
      ansible.builtin.command:
        cmd: >-
          bash /tmp/swift_patches/apply.sh
          /usr/lib/python3.9/site-packages/swift
          {{ '--with-bs' if (swift_backend | default('')) == 'bs' else '' }}
      register: swift_apply
      changed_when: "': applied' in swift_apply.stdout"

    - name: Show Swift patch applier output
      ansible.builtin.debug:
        var: swift_apply.stdout_lines
