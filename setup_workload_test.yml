---
# Run workload tests and verification

- name: Workload tests
  hosts: package_cache
  become: true
  tasks:
    - name: Copy tests directory to package_cache host
      ansible.builtin.copy:
        src: workload_tests
        dest: /home/vagrant/
        mode: "0755"
    - name: Copy hosts inventory to workload_tests directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/hosts"
        dest: /home/vagrant/workload_tests/hosts
        mode: "0644"

    - name: Enable CRB repository
      ansible.builtin.command:
        cmd: dnf config-manager --enable crb
      changed_when: false

    - name: Install OpenStack Epoxy release package
      ansible.builtin.dnf:
        name: centos-release-openstack-epoxy
        state: present

    - name: Update package cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Install pytest using system package manager
      ansible.builtin.dnf:
        name: python3-pytest
        state: present

    - name: Install python3-swiftclient
      ansible.builtin.dnf:
        name: python3-swiftclient
        state: present

    # We're currently only running the tiny test. It would be good to run everything!
    # Invocation lives in workload_tests/run.sh — the same runner the Kubernetes
    # smoke test (kube_deploy/scripts/smoke-test.sh) calls.
    - name: Run workload tests via the shared runner
      ansible.builtin.command: bash run.sh workload
      args:
        chdir: /home/vagrant/workload_tests
      register: pytest_result
      changed_when: false

- name: Verify BlueStore utilities
  hosts: storage
  become: true
  environment:
    PATH: "/home/vagrant/ceph/build/bin:{{ ansible_env.PATH }}"
  tasks:
    - name: Check if BlueStore utilities should be verified
      ansible.builtin.set_fact:
        verify_bs_utils: "{{ swift_backend is defined and swift_backend == 'bs_fork' }}"

    # Tool names come from the single source of truth: ceph_patches/tools.list.
    - name: Verify each BlueStore utility is present
      ansible.builtin.command: "which {{ item }}"
      loop: "{{ lookup('file', playbook_dir + '/ceph_patches/tools.list').splitlines() }}"
      register: bs_utils_which
      changed_when: false
      failed_when: false
      when: verify_bs_utils

    - name: Show BlueStore utilities verification results
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'FOUND' if item.rc == 0 else 'NOT FOUND' }}"
      loop: "{{ bs_utils_which.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: verify_bs_utils

    - name: Fail if any BlueStore utility is missing
      ansible.builtin.fail:
        msg: >-
          FAILED: missing BlueStore utilities:
          {{ bs_utils_which.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}
      when:
        - verify_bs_utils
        - bs_utils_which.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0

- name: Run comprehensive BlueStore utility tests
  hosts: storage
  become: true
  environment:
    PATH: "/home/vagrant/ceph/build/bin:{{ ansible_env.PATH }}"
    BS_XATTR_PATH: "/home/vagrant/ceph/build/bin/bs_xattr"
    BS_ONDISK_PATH: "/home/vagrant/ceph/build/bin/bs_ondisk"
    BS_UTIL_PATH: "/home/vagrant/ceph/build/bin/bs_util"
  tasks:
    - name: Check if BlueStore tests should run
      ansible.builtin.set_fact:
        run_bs_tests: "{{ swift_backend is defined and swift_backend == 'bs_fork' }}"

    # Glob the bs suite (test_bs_*.py) + the shared runner, so a future bs test
    # is picked up with no change here — same files run.sh bs runs in the image.
    - name: Copy bs test suite + shared runner to storage nodes
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /home/vagrant/
        mode: "0755"
      loop: >-
        {{ query('fileglob', playbook_dir + '/workload_tests/test_bs_*.py')
           + [playbook_dir + '/workload_tests/run.sh'] }}
      when: run_bs_tests

    - name: Install pytest on storage nodes
      ansible.builtin.dnf:
        name: python3-pytest
        state: present
      when: run_bs_tests

    - name: Run BlueStore utility tests via the shared runner
      ansible.builtin.command: bash run.sh bs
      args:
        chdir: /home/vagrant
      register: bs_tests
      changed_when: false
      failed_when: false
      when: run_bs_tests

    - name: Display BlueStore utility test results
      ansible.builtin.debug:
        msg: |
          BlueStore tests {{ 'PASSED' if bs_tests.rc == 0 else 'FAILED' }}
          {{ bs_tests.stdout }}
      when: run_bs_tests

    - name: Fail if BlueStore utility tests failed
      ansible.builtin.fail:
        msg: "BlueStore utility tests failed! Check output above for details."
      when:
        - run_bs_tests
        - bs_tests.rc != 0

